<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cydia iOS 8 Style</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        background: #0a0a0a; /* Classic Cydia dark background */
        color: #fff;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .container {
        width: 320px;
        background: rgba(30, 30, 30, 0.95);
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8),
                    inset 0 1px 0 rgba(255,255,255,0.08);
        overflow: hidden;
        border: 1px solid #444;
    }

    .header {
        background: linear-gradient(to bottom, #1f1f1f, #0f0f0f);
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #00aaff;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .content {
        padding: 15px;
    }

    button {
        width: 100%;
        padding: 14px 15px;
        margin: 6px 0;
        background: linear-gradient(to bottom, #555555, #3a3a3a);
        color: white;
        border: 1px solid #777;
        border-radius: 8px;
        font-size: 17px;
        font-weight: 500;
        box-shadow: 
            inset 0 1px 0 rgba(255,255,255,0.3),
            0 2px 4px rgba(0,0,0,0.5);
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        cursor: pointer;
        transition: all 0.15s ease;
    }

    button:hover {
        background: linear-gradient(to bottom, #666666, #4a4a4a);
        border-color: #888;
    }

    button:active {
        background: linear-gradient(to bottom, #3a3a3a, #555555);
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        transform: translateY(1px);
    }

    /* Cydia-style blue accent button */
    .accent {
        background: linear-gradient(to bottom, #007aff, #0062cc);
        border-color: #0088ff;
    }

    .accent:hover {
        background: linear-gradient(to bottom, #0088ff, #0070e0);
    }

    .hidden {
        display: none;
    }

    .section-title {
        color: #888;
        font-size: 13px;
        text-transform: uppercase;
        margin: 12px 0 6px 8px;
        font-weight: 600;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Cydia • Olly's Shit</h1>
    </div>
    
    <div class="content">
        <button onclick="toggleProjects()" class="accent">Projects</button>
        
        <div id="projects" class="hidden">
            <div class="section-title">My Projects</div>
            <button onclick="go('https://example.com/1')">Project 1</button>
            <button onclick="go('https://example.com/2')">Project 2</button>
            <button onclick="go('https://example.com/3')">Project 3</button>
            <button onclick="go('https://example.com/4')">Project 4</button>
            <button onclick="go('https://example.com/5')">Project 5</button>
        </div>
    </div>
</div>

<script>
function toggleProjects() {
    let proj = document.getElementById("projects");
    proj.classList.toggle("hidden");
}

function go(url) {
    window.location.href = url;
}
</script>

</body>
</html>
