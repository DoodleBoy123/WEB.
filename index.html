<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MZEDS Archive</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: #0b0f14;
    color: #d1d5db;
    font-family: Inter, system-ui;
    margin: 0;
}

/* Layout */
.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Content */
.content {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

/* Cards */
.card {
    background: rgba(17,22,29,0.8);
    border: 1px solid #1f2933;
    transition: 0.2s;
    backdrop-filter: blur(6px);
    cursor: pointer;
    border-radius: 0.5rem;
}

.card:hover {
    border-color: #3b82f6;
    transform: translateY(-3px);
}

/* Grid responsive tweaks */
#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1rem;
}

/* Search & Select */
.search, #filterSelect {
    background: #11161d;
    border: 1px solid #1f2933;
    color: #d1d5db;
}

#filterSelect {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
}

/* Modal */
.modal {
    backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<!-- VIDEO BG -->
<video autoplay muted loop playsinline class="fixed top-0 left-0 w-full h-full object-cover -z-10">
    <source src="./background.mp4">
</video>
<div class="fixed inset-0 bg-black/70 -z-10"></div>

<div class="app">

    <!-- TOP BAR -->
    <div class="flex justify-between items-center mb-8 px-4 pt-4">
        <div class="flex items-center gap-4">
            <div class="text-xl text-white font-semibold flex items-center gap-2">
                <i class="fa-solid fa-database"></i> MZEDS
            </div>
            <!-- Dropdown Filter -->
            <select id="filterSelect">
                <option value="ALL">All Mods</option>
                <option value="SPRX">SPRX Menus</option>
                <option value="SKIN">Skin Packs</option>
                <option value="TOOL">Tools</option>
            </select>
        </div>

        <div class="relative">
            <i class="fa-solid fa-search absolute left-3 top-3 text-gray-500"></i>
            <input id="search" placeholder="Search..." class="search pl-10 pr-4 py-2 rounded w-64">
        </div>
    </div>

    <!-- GRID -->
    <div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 px-4"></div>

</div>

<!-- MODAL -->
<div id="details" class="hidden fixed inset-0 modal flex items-center justify-center bg-black/70">
    <div class="bg-[#0f141a] border border-[#1f2933] p-8 rounded-xl max-w-lg w-full relative">
        <button onclick="closeDetails()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="detailsContent"></div>
    </div>
</div>

<!-- JS -->
<script>
const mods = [
  {
    name: "DownCraft v4.5 CFW/HEN",
    type: "SPRX",
    version: "4.5",
    creator: "MisakiDev",
    description: "Stable premium menu with clean UI.",
    features: ["ESP", "Fly", "Give Items"],
    image: "https://img.youtube.com/vi/Yal7zzdhfxo/maxresdefault.jpg",
    download: "https://www.mediafire.com/file/zfdmi3goo8j35gu/%255BDownCraft%255D_V4.5_Premium%2528CREATED_BY_MisakiDev%2529.rar/file"
  },
  {
    name: "UltimateCraft V3 CFW/HEN",
    type: "SPRX",
    version: "V3 (Beta)",
    creator: "MayhemModding",
    description: "UltimateCraft is a massive project that contains over 500+ mods",
    features: ["Self Mods", "Player Mods etc..."],
    image: "https://i.ibb.co/KjPVyq2Y/image.png",
    download: "https://mega.nz/file/j0M2GaZQ#LCIniPsIoUw53b77PgERF8iphvxUl2LXcTHVXzkC7ZY"
  },
  {
    name: "MZEDS Skin Packs",
    type: "SKIN",
    version: "1.0",
    creator: "CREDIT - SILVER",
    description: "A collection of 800+ custom skins for Minecraft PS3. THIS WILL REQUIRE FTP",
    features: ["800+ Skins", "Easy Installation"],
    image: "https://i.ytimg.com/vi/AcL9cZBuur4/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDmo8vSTzO8LroGPO_Qk-BRIDXqcw",
    download: "https://www.mediafire.com/file/qj76cv8pmawhwc2/HUGE_PS3_SKIN_PACK.rar/file"
  },
  {
    name: "PCK Studio",
    type: "TOOL",
    version: "7.0",
    creator: "CREDIT - PhoenixARC",
    description: "All-in-one tool for editing minecraft PS3 skin packs and maps etc...",
    features: ["Skin Editing", "One-Click Install"],
    image: "https://images.gamebanana.com/img/ss/tools/6468e20425a88.jpg",
    download: "https://github.com/LCERD/PCK-Studio/releases/download/Beta/PCK-Studio-Beta-23w19c.zip"
  }
];

let currentFilter = "ALL";

function setFilter(f) {
    currentFilter = f;
    render();
}

document.getElementById("filterSelect").addEventListener("change", (e) => {
    setFilter(e.target.value);
});

document.getElementById("search").addEventListener("input", render);

function render() {
    const grid = document.getElementById("grid");
    const search = document.getElementById("search").value.toLowerCase();
    grid.innerHTML = "";

    mods.forEach(mod => {
        if (currentFilter !== "ALL" && mod.type !== currentFilter) return;
        if (!mod.name.toLowerCase().includes(search)) return;

        const div = document.createElement("div");
        div.className = "card p-5";

        div.innerHTML = `
            <img src="${mod.image}" class="mb-3 w-full rounded-lg object-cover">
            <div class="text-white font-medium mb-1">${mod.name}</div>
            <div class="text-xs text-gray-500 mb-2">${mod.type}</div>
            <div class="text-sm text-gray-400">${mod.description}</div>
        `;
        div.onclick = () => openDetails(mod);
        grid.appendChild(div);
    });
}

function openDetails(mod) {
    document.body.style.overflow = "hidden";
    document.getElementById("detailsContent").innerHTML = `
        <img src="${mod.image}" class="mb-4 w-full rounded-lg">
        <h2 class="text-xl text-white mb-2">${mod.name}</h2>
        <div class="text-sm mb-2">Version: ${mod.version}</div>
        <div class="text-sm mb-4">Creator: ${mod.creator}</div>
        <ul class="text-sm text-gray-400 mb-4">
            ${mod.features.map(f => `<li>- ${f}</li>`).join("")}
        </ul>
        <a href="${mod.download}" class="bg-blue-600 px-4 py-2 rounded inline-block">Download</a>
    `;
    document.getElementById("details").classList.remove("hidden");
}

function closeDetails() {
    document.getElementById("details").classList.add("hidden");
    document.body.style.overflow = "auto";
}

// initial render
render();
</script>

</body>
</html>
