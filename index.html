<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MZEDS Archive</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: #0b0f14;
    color: #d1d5db;
    font-family: Inter, system-ui;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    background: #11161d;
    border: 1px solid #1f2933;
    transition: 0.2s;
}

.card:hover {
    border-color: #3b82f6;
    transform: translateY(-2px);
}

.btn {
    background: #1f2933;
    border: 1px solid #374151;
}

.btn:hover {
    background: #2563eb;
    border-color: #2563eb;
    color: white;
}

.tag {
    font-size: 11px;
    padding: 3px 8px;
    background: #1f2933;
    border: 1px solid #374151;
}
</style>
</head>

<body>

<!-- 🎥 BACKGROUND VIDEO -->
<video autoplay muted loop playsinline class="fixed top-0 left-0 w-full h-full object-cover -z-10">
    <source src="background.mp4" type="video/mp4">
</video>
<div class="fixed inset-0 bg-black/70 -z-10"></div>

<!-- NAV -->
<div class="border-b border-[#1f2933] bg-black/40 backdrop-blur">
    <div class="container flex justify-between items-center">

        <div class="text-xl font-semibold tracking-tight flex items-center gap-2">
            <i class="fa-solid fa-database"></i>
            MZEDS
        </div>

        <div class="flex gap-6 text-sm items-center">
            <a href="#" class="hover:text-white flex items-center gap-1">
                <i class="fa-solid fa-box-archive"></i> Archive
            </a>
            <a href="#" class="hover:text-white flex items-center gap-1">
                <i class="fa-solid fa-book"></i> Docs
            </a>
            <a href="#" class="hover:text-white flex items-center gap-1">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
        </div>

    </div>
</div>

<div class="container">

    <!-- HERO -->
    <div class="mb-12">
        <h1 class="text-4xl font-semibold text-white flex items-center gap-3">
            <i class="fa-brands fa-playstation"></i>
            Minecraft PS3 Mod Archive
        </h1>

        <p class="text-gray-400 mt-2 max-w-lg">
            Curated SPRX menus, tools and legacy content. Clean builds only.
        </p>
    </div>

    <!-- SEARCH + FILTER -->
    <div class="mb-6 flex gap-3 flex-wrap items-center">

        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500"></i>
            <input id="search" placeholder="Search mods..."
            class="bg-[#111] border border-[#333] pl-10 pr-4 py-2 rounded w-64">
        </div>

        <select id="filter" class="bg-[#111] border border-[#333] px-3 py-2 rounded">
            <option value="ALL">All</option>
            <option value="SPRX">SPRX</option>
            <option value="SKIN">Skin Packs</option>
            <option value="TOOL">Tools</option>
        </select>

    </div>

    <!-- GRID -->
    <div id="grid" class="grid md:grid-cols-2 gap-6"></div>

</div>

<!-- DETAILS PANEL -->
<div id="details" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">

<div class="bg-[#111] p-8 rounded-xl max-w-lg w-full relative">

<button onclick="closeDetails()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
    <i class="fa-solid fa-xmark"></i>
</button>

<div id="detailsContent"></div>

</div>
</div>

<!-- DATA -->
<script>
const mods = [
{
    name: "DownCraft v4.5",
    type: "SPRX",
    version: "4.5",
    creator: "MisakiDev",
    description: "Stable premium menu with clean UI.",
    features: ["ESP", "Fly", "Give Items", "Host Tools"],
    image: "https://via.placeholder.com/400x200",
    download: "https://www.mediafire.com/"
},
{
    name: "UltimateCraft v2",
    type: "SPRX",
    version: "V3",
    creator: "Unknown",
    description: "The UltimateCraft V3 Beta provides a comprehensive mod menu that includes various options for players to utilize.",
    features: ["Armor and Weapons: Players can give themselves or others armor and weapons to boost their stats and combat abilities.", "Player Mods", "Fun Tools"],
    image: "https://via.placeholder.com/400x200",
    download: "https://www.mediafire.com/"
},
{
    name: "Custom Skin Pack",
    type: "SKIN",
    version: "TU75",
    creator: "MZED",
    description: "Large Minecraft PS3 skin pack.",
    features: ["100+ Skins"],
    image: "https://via.placeholder.com/400x200",
    download: "https://www.mediafire.com/"
}
];
</script>

<!-- LOGIC -->
<script>
function render() {
    const grid = document.getElementById("grid");
    const search = document.getElementById("search").value.toLowerCase();
    const filter = document.getElementById("filter").value;

    grid.innerHTML = "";

    mods.forEach(mod => {

        if (filter !== "ALL" && mod.type !== filter) return;
        if (!mod.name.toLowerCase().includes(search)) return;

        const div = document.createElement("div");
        div.className = "card p-6 rounded-xl cursor-pointer";

        div.innerHTML = `
            <div class="flex justify-between mb-2">
                <div class="text-white font-medium flex items-center gap-2">
                    <i class="fa-solid fa-cube"></i>
                    ${mod.name}
                </div>
                <div class="text-xs opacity-60 flex items-center gap-1">
                    <i class="fa-solid fa-tag"></i> ${mod.type}
                </div>
            </div>

            <div class="text-sm text-gray-400 mb-4">
                ${mod.description}
            </div>
        `;

        div.onclick = () => openDetails(mod);
        grid.appendChild(div);
    });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);

render();

function openDetails(mod) {

    const panel = document.getElementById("details");
    const content = document.getElementById("detailsContent");

    content.innerHTML = `
        <img src="${mod.image}" class="mb-4 rounded">

        <h2 class="text-xl text-white mb-2 flex items-center gap-2">
            <i class="fa-solid fa-cube"></i>
            ${mod.name}
        </h2>

        <div class="text-sm mb-2 flex items-center gap-2">
            <i class="fa-solid fa-code"></i> Version: ${mod.version}
        </div>

        <div class="text-sm mb-2 flex items-center gap-2">
            <i class="fa-solid fa-user"></i> Creator: ${mod.creator}
        </div>

        <div class="mt-4 mb-2 text-sm text-gray-400">
            ${mod.description}
        </div>

        <div class="mt-4">
            <div class="text-sm mb-1 flex items-center gap-2">
                <i class="fa-solid fa-list"></i> Features:
            </div>

            <ul class="text-sm text-gray-400">
                ${mod.features.map(f => `<li>- ${f}</li>`).join("")}
            </ul>
        </div>

        <div class="mt-6">
            <a href="${mod.download}" target="_blank"
            class="btn px-4 py-2 rounded inline-flex items-center gap-2 mt-2">
            <i class="fa-solid fa-download"></i> Download
            </a>
        </div>
    `;

    panel.classList.remove("hidden");
}

function closeDetails() {
    document.getElementById("details").classList.add("hidden");
}
</script>

</body>
</html>
