<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MZEDS Archive</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: #0b0f14;
    color: #d1d5db;
    font-family: Inter, system-ui;
}

/* Layout */
.app {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 240px;
    background: rgba(10,15,20,0.9);
    border-right: 1px solid #1f2933;
    backdrop-filter: blur(10px);
}

.sidebar-item {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border-radius: 8px;
}

.sidebar-item:hover {
    background: #11161d;
}

/* Content */
.content {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

/* Cards */
.card {
    background: rgba(17,22,29,0.8);
    border: 1px solid #1f2933;
    transition: 0.2s;
    backdrop-filter: blur(6px);
}

.card:hover {
    border-color: #3b82f6;
    transform: translateY(-3px);
}

/* Search */
.search {
    background: #11161d;
    border: 1px solid #1f2933;
}

/* Modal */
.modal {
    backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<!-- VIDEO BG -->
<video autoplay muted loop playsinline class="fixed top-0 left-0 w-full h-full object-cover -z-10">
    <source src="./background.mp4">
</video>
<div class="fixed inset-0 bg-black/70 -z-10"></div>

<div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar p-4">

        <div class="text-lg font-semibold mb-6 flex items-center gap-2">
            <i class="fa-solid fa-database"></i>
            MZEDS
        </div>

        <div class="space-y-2 text-sm">

            <div class="sidebar-item" onclick="setFilter('ALL')">
                <i class="fa-solid fa-layer-group"></i> All Mods
            </div>

            <div class="sidebar-item" onclick="setFilter('SPRX')">
                <i class="fa-solid fa-code"></i> SPRX Menus
            </div>

            <div class="sidebar-item" onclick="setFilter('SKIN')">
                <i class="fa-solid fa-shirt"></i> Skin Packs
            </div>

            <div class="sidebar-item" onclick="setFilter('TOOL')">
                <i class="fa-solid fa-wrench"></i> Tools
            </div>

        </div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- TOP BAR -->
        <div class="flex justify-between items-center mb-8">

            <div>
                <div class="text-xl text-white font-semibold">Archive</div>
                <div class="text-sm text-gray-400">Minecraft PS3 Mods</div>
            </div>

            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-3 text-gray-500"></i>
                <input id="search" placeholder="Search..."
                class="search pl-10 pr-4 py-2 rounded w-64">
            </div>

        </div>

        <!-- GRID -->
        <div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    </div>

</div>

<!-- MODAL -->
<div id="details" class="hidden fixed inset-0 modal flex items-center justify-center bg-black/70">

<div class="bg-[#0f141a] border border-[#1f2933] p-8 rounded-xl max-w-lg w-full relative">

<button onclick="closeDetails()" class="absolute top-4 right-4">
    <i class="fa-solid fa-xmark"></i>
</button>

<div id="detailsContent"></div>

</div>
</div>

<!-- DATA -->
<script>
const mods = [
{
    name: "DownCraft v4.5",
    type: "SPRX",
    version: "4.5",
    creator: "MisakiDev",
    description: "Stable premium menu with clean UI.",
    features: ["ESP", "Fly", "Give Items"],
    image: "https://via.placeholder.com/400x200",
    download: "#"
},
{
    name: "UltimateCraft V3",
    type: "SPRX",
    version: "V3",
    creator: "Unknown",
    description: "Full testing mod menu.",
    features: ["World Edit", "Player Mods"],
    image: "https://via.placeholder.com/400x200",
    download: "#"
}
];

let currentFilter = "ALL";

function setFilter(f) {
    currentFilter = f;
    render();
}

function render() {
    const grid = document.getElementById("grid");
    const search = document.getElementById("search").value.toLowerCase();

    grid.innerHTML = "";

    mods.forEach(mod => {

        if (currentFilter !== "ALL" && mod.type !== currentFilter) return;
        if (!mod.name.toLowerCase().includes(search)) return;

        const div = document.createElement("div");
        div.className = "card p-5 rounded-lg cursor-pointer";

        div.innerHTML = `
            <div class="text-white font-medium mb-2">${mod.name}</div>
            <div class="text-xs text-gray-500 mb-3">${mod.type}</div>
            <div class="text-sm text-gray-400">${mod.description}</div>
        `;

        div.onclick = () => openDetails(mod);
        grid.appendChild(div);
    });
}

document.getElementById("search").addEventListener("input", render);
render();

function openDetails(mod) {
    document.body.style.overflow = "hidden";

    document.getElementById("detailsContent").innerHTML = `
        <h2 class="text-xl text-white mb-2">${mod.name}</h2>
        <div class="text-sm mb-2">Version: ${mod.version}</div>
        <div class="text-sm mb-4">Creator: ${mod.creator}</div>

        <ul class="text-sm text-gray-400 mb-4">
            ${mod.features.map(f => `<li>- ${f}</li>`).join("")}
        </ul>

        <a href="${mod.download}" class="bg-blue-600 px-4 py-2 rounded">
            Download
        </a>
    `;

    document.getElementById("details").classList.remove("hidden");
}

function closeDetails() {
    document.getElementById("details").classList.add("hidden");
    document.body.style.overflow = "auto";
}
</script>

</body>
</html>
